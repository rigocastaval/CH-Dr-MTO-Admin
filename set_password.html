<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear contraseña — Sistema Hospitalario</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo-wrap">
      <img src="logo_issste.png" alt="ISSSTE" style="height:44px;object-fit:contain;"/>
    </div>

    <!-- Estado: verificando enlace -->
    <div id="state-loading" style="text-align:center;padding:20px 0;">
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:var(--texto-2);font-size:14px;">
        <div class="spinner"></div> Verificando enlace…
      </div>
    </div>

    <!-- Estado: establecer contraseña -->
    <div id="state-form" style="display:none;">
      <div style="font-size:16px;font-weight:600;margin-bottom:4px;">Crear tu contraseña</div>
      <div style="font-size:12px;color:var(--texto-2);margin-bottom:20px;">Elige una contraseña segura para tu cuenta.</div>

      <div id="error-msg" class="error-msg"></div>

      <div class="field">
        <label>Nueva contraseña</label>
        <input type="password" id="pass1" placeholder="Mínimo 8 caracteres" autocomplete="new-password"/>
      </div>
      <div class="field">
        <label>Confirmar contraseña</label>
        <input type="password" id="pass2" placeholder="Repite la contraseña" autocomplete="new-password"/>
      </div>

      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="setPassword()">
        Guardar contraseña e iniciar sesión
      </button>
    </div>

    <!-- Estado: éxito -->
    <div id="state-success" style="display:none;text-align:center;padding:10px 0;">
      <div style="font-size:32px;margin-bottom:10px;">✅</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:6px;">¡Contraseña creada!</div>
      <div style="font-size:13px;color:var(--texto-2);margin-bottom:20px;">Tu cuenta está lista. Redirigiendo…</div>
    </div>

    <!-- Estado: enlace inválido -->
    <div id="state-error" style="display:none;text-align:center;padding:10px 0;">
      <div style="font-size:32px;margin-bottom:10px;">⚠️</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:6px;">Enlace inválido o expirado</div>
      <div style="font-size:12px;color:var(--texto-2);margin-bottom:16px;">Solicita al administrador que te reenvíe la invitación.</div>
      <a href="index.html" class="btn btn-primary" style="display:inline-flex;">Ir al inicio de sesión</a>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script>
function show(id){
  ['state-loading','state-form','state-success','state-error'].forEach(s=>{
    document.getElementById(s).style.display = s===id ? 'block' : 'none';
  });
}

// Supabase envía el token en el hash de la URL cuando el usuario hace clic en el correo
(async()=>{
  try{
    // Detectar si hay sesión activa desde el magic link
    const{data:{session},error}=await db.auth.getSession();

    if(error||!session){
      // Intentar recuperar sesión desde el hash de la URL
      const hash=window.location.hash;
      if(hash&&hash.includes('access_token')){
        const params=new URLSearchParams(hash.replace('#',''));
        const accessToken=params.get('access_token');
        const refreshToken=params.get('refresh_token');
        if(accessToken){
          const{data,error:setErr}=await db.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
          if(setErr||!data.session){show('state-error');return;}
        } else {
          show('state-error');return;
        }
      } else {
        show('state-error');return;
      }
    }

    show('state-form');
  }catch(err){
    console.error(err);
    show('state-error');
  }
})();

async function setPassword(){
  const p1=document.getElementById('pass1').value;
  const p2=document.getElementById('pass2').value;
  const errEl=document.getElementById('error-msg');

  if(p1.length<8){errEl.textContent='La contraseña debe tener al menos 8 caracteres.';errEl.style.display='block';return;}
  if(p1!==p2){errEl.textContent='Las contraseñas no coinciden.';errEl.style.display='block';return;}
  errEl.style.display='none';

  const{data:{user},error}=await db.auth.updateUser({password:p1});
  if(error){errEl.textContent='Error: '+error.message;errEl.style.display='block';return;}

  // Vincular auth_id al perfil pre-registrado
  if(user){
    const{data:perfil}=await db.from('usuarios').select('id,auth_id').eq('email',user.email).maybeSingle();
    if(perfil&&!perfil.auth_id){
      await db.from('usuarios').update({auth_id:user.id}).eq('id',perfil.id);
    }
  }

  show('state-success');
  setTimeout(()=>window.location.href='hospitalizacion.html', 2000);
}

document.addEventListener('keydown',e=>{if(e.key==='Enter')setPassword();});
</script>
</body>
</html>
