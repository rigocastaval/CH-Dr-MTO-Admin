<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admisión Urgencias — Sistema Hospitalario</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .header-date{font-size:12px;color:var(--texto-2);background:var(--bg);border:1px solid var(--gris-borde);border-radius:var(--radio);padding:4px 10px;}
    .turno-panel{background:var(--surface);border:1px solid var(--gris-borde);border-radius:var(--radio-lg);padding:14px 18px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}

    /* CORRECCIÓN: CSS Sticky unificado */
    .tbl-wrap table thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg, #F8F7F4);
      box-shadow: 0 1px 0 #b4b2a9;
    }

    .tbl-wrap{max-height:650px;overflow-y:auto;border:1px solid var(--gris-borde);border-radius:var(--radio);}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;}
    th{padding:10px 12px;text-align:left;font-size:10px;text-transform:uppercase;color:var(--texto-3);border-bottom:1px solid var(--gris-borde);}
    td{padding:8px 12px;border-bottom:1px solid var(--gris-borde);background:#fff;color:var(--texto);}
  </style>
</head>
<body>
<header class="header">
  <div class="header-left">
    <img src="logo_issste.png" alt="ISSSTE" style="height:36px;"/>
  </div>
  <div class="header-right">
    <span class="header-date" id="fecha-hoy"></span>
    <button class="btn btn-sm" onclick="logout()">Salir</button>
  </div>
</header>

<div class="app-layout">
  <nav class="sidebar">
    <div class="sidebar-section">Servicios</div>
    <a class="sidebar-item" href="hospitalizacion.html">Hospitalización</a>
    <a class="sidebar-item active" href="urgencias.html">Urgencias</a>
    <div class="sidebar-section">Reportes</div>
    <a class="sidebar-item active" href="admision_urgencias.html">Admisión Urgencias</a>
  </nav>

  <main class="content">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Registro de Admisión Urgencias</h2>
      </div>

      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Folio</th>
              <th>Nombre del Paciente</th>
              <th>Sexo</th>
              <th>Edad</th>
              <th>Motivo de Atención</th>
              <th>Fecha/Hora Ingreso</th>
            </tr>
          </thead>
          <tbody id="tbody-admision">
            </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// Lógica de autenticación y carga aquí
document.getElementById('fecha-hoy').innerText = new Date().toLocaleDateString();
function logout(){ localStorage.clear(); window.location.href='index.html'; }
</script>
</body>
</html>
