<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Hospitalario — Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo-wrap">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="11" y="3" width="2" height="18" rx="1" fill="white"/>
          <rect x="3" y="11" width="18" height="2" rx="1" fill="white"/>
        </svg>
      </div>
      <div>
        <div class="login-title">Sistema Hospitalario</div>
        <div class="login-sub">Gestión de camas · ISSSTE</div>
      </div>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="email" placeholder="usuario@hospital.mx" autocomplete="username" />
    </div>

    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;" onclick="doLogin()">
      Iniciar sesión
    </button>

    <p class="login-hint">
      Sistema de uso interno. Si olvidaste tu contraseña, contacta al administrador.
    </p>
  </div>
</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script>
  /* Si ya hay sesión activa, redirige directo */
  (async () => {
    const session = await getSession();
    if (session) {
      const user = await getUser();
      const rol = user?.rol || 'viewer';
      const destino = {
        ventanilla_admision: 'admision_urgencias.html',
        director:            'reporte.html',
        subdirector:         'reporte.html',
      };
      window.location.href = destino[rol] || 'hospitalizacion.html';
    }
  })();

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('error-msg');

    if (!email || !password) {
      errEl.textContent = 'Ingresa correo y contraseña.';
      errEl.style.display = 'block';
      return;
    }

    errEl.style.display = 'none';
    const btn = document.querySelector('.btn-primary');
    btn.textContent = 'Entrando…';
    btn.disabled = true;

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = 'Correo o contraseña incorrectos.';
      errEl.style.display = 'block';
      btn.textContent = 'Iniciar sesión';
      btn.disabled = false;
    } else {
      // Obtener sesión y buscar perfil por auth_id O por email
      const { data: { session } } = await db.auth.getSession();
      let rol = 'viewer';
      if (session) {
        // Primero por auth_id
        let { data: perfil } = await db
          .from('usuarios')
          .select('rol, auth_id, id')
          .eq('auth_id', session.user.id)
          .maybeSingle();

        // Si no hay, buscar por email y vincular auth_id
        if (!perfil) {
          const { data: perfilEmail } = await db
            .from('usuarios')
            .select('rol, auth_id, id')
            .eq('email', session.user.email)
            .maybeSingle();
          if (perfilEmail) {
            // Vincular auth_id ahora que el usuario inició sesión
            await db.from('usuarios').update({ auth_id: session.user.id }).eq('id', perfilEmail.id);
            perfil = perfilEmail;
          }
        }
        rol = perfil?.rol || 'viewer';
      }

      const DESTINO = {
        ventanilla_admision: 'admision_urgencias.html',
        director:            'reporte.html',
        subdirector:         'reporte.html',
        medico_operativo:    'hospitalizacion.html',
        jefa_enfermeria:     'hospitalizacion.html',
        admin:               'hospitalizacion.html',
        editor:              'hospitalizacion.html',
        viewer:              'hospitalizacion.html',
      };
      window.location.href = DESTINO[rol] || 'hospitalizacion.html';
    }
  }

  /* Permite presionar Enter */
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
